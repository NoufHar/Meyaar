<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meyaar — Error Analysis Chat</title>
<style>
  :root { --accent:#4338ca; --bg:#f6f5f1; --card:#fff; --text:#1e1b4b; --muted:#6b7280; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         background:var(--bg); color:var(--text); }
  .wrap { max-width:860px; margin:0 auto; padding:24px 16px 60px; }
  header h1 { font-size:22px; margin:0 0 2px; }
  header p  { color:var(--muted); margin:0 0 18px; font-size:13px; }
  .card { background:var(--card); border:1px solid #e5e7eb; border-radius:12px;
          padding:16px; margin-bottom:14px; }
  label { font-size:12px; font-weight:600; display:block; margin:0 0 4px; color:var(--muted); }
  input, textarea { width:100%; padding:9px 11px; border:1px solid #d1d5db; border-radius:8px;
                    font:inherit; }
  textarea { resize:vertical; min-height:64px; }
  .row { display:flex; gap:8px; margin-top:10px; align-items:center; }
  button { border:none; border-radius:8px; padding:9px 16px; font:inherit; cursor:pointer; }
  #askBtn { background:var(--accent); color:#fff; }
  #askBtn:disabled { opacity:.6; cursor:wait; }
  #status { color:var(--muted); font-size:13px; }
  #error { color:#b91c1c; font-size:13px; white-space:pre-wrap; }
  #answer { line-height:1.5; }
  #answer:empty { display:none; }
  .chip { display:inline-block; background:#eef2ff; color:var(--accent); font-size:12px;
          border-radius:999px; padding:3px 10px; margin:2px 4px 2px 0; }
  .hint { font-size:12px; color:var(--muted); }
  a { color:var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Meyaar — Error Analysis Chat</h1>
    <p>Ask questions about a validation run. Answers are grounded in the run&rsquo;s engine results &amp; agent analyses.</p>
  </header>

  <div class="card">
    <label for="runId">Run ID (UUID from public.validation_results)</label>
    <input id="runId" placeholder="e.g. 8f0a1b2c-3d4e-4f5a-8b9c-0d1e2f3a4b5c" autocomplete="off">
    <label for="question" style="margin-top:10px">Question</label>
    <textarea id="question" placeholder="e.g. What should I fix first?"></textarea>
    <div class="row">
      <button id="askBtn">Ask</button>
      <button id="analyzeBtn" title="Run error analysis for this run first">Analyze run</button>
      <button id="micBtn" title="Speak your question (browser speech recognition)">🎤</button>
      <button id="speakBtn" title="Read the answer aloud (browser TTS)">🔊</button>
      <span id="status"></span>
    </div>
    <div id="voiceStatus" class="hint"></div>
    <div id="error"></div>
  </div>

  <div class="card">
    <label>Answer</label>
    <div id="answer"></div>
  </div>

  <p class="hint">API docs: <a href="/docs">/docs</a> &nbsp;·&nbsp; info: <a href="/api/info">/api/info</a> &nbsp;·&nbsp;
  New run? <code>bash agent/scripts/live_test.sh</code> prints fresh run ids.</p>
</div>

<script>
const $ = id => document.getElementById(id);
async function post(url, body) {
  const r = await fetch(url, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(body || {})
  });
  if (!r.ok) {
    let detail = r.statusText;
    try { const j = await r.json(); detail = j.detail || JSON.stringify(j); } catch (_) {}
    throw new Error("HTTP " + r.status + ": " + detail);
  }
  return r.json();
}
async function ask() {
  if ("speechSynthesis" in window) window.speechSynthesis.cancel();  // stop reading
  $("speakBtn").textContent = "🔊";
  const runId = $("runId").value.trim();
  const q = $("question").value.trim();
  $("error").textContent = "";
  if (!runId || !q) { $("error").textContent = "Enter a run ID and a question."; return; }
  $("askBtn").disabled = true; $("status").textContent = "asking…";
  try {
    const out = await post("/api/validation/" + encodeURIComponent(runId) + "/chat", {question: q});
    $("answer").innerHTML = escapeHtml(out.answer);
    const src = (out.sources || []).map(s => '<span class="chip">' + escapeHtml(s) + "</span>").join("");
    $("answer").insertAdjacentHTML("beforeend", src ? "<br><br>Sources: " + src : "");
    $("status").textContent = "";
  } catch (e) {
    $("error").textContent = "Chat failed. " + e.message +
      "\nTip: run analysis first if this run has no results yet (button above), and ensure the LLM key is set in agent/.env.";
  } finally {
    $("askBtn").disabled = false;
  }
}
async function analyzeRun() {
  const runId = $("runId").value.trim();
  $("error").textContent = "";
  if (!runId) { $("error").textContent = "Enter a run ID."; return; }
  $("analyzeBtn").disabled = true; $("status").textContent = "analyzing…";
  try {
    const out = await post("/api/validation/" + encodeURIComponent(runId) + "/analyze");
    $("status").textContent = "analyzed " + out.total_errors_analyzed + " error(s) — you can chat now.";
  } catch (e) {
    $("error").textContent = "Analyze failed. " + e.message;
  } finally {
    $("analyzeBtn").disabled = false;
  }
}
function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

/* ── Voice: STT (mic) + TTS (read answer) via browser APIs ─────────────── */
const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;
function setVoiceStatus(msg) { $("voiceStatus").textContent = msg; }

async function startMic() {
  if (!SpeechRec) { setVoiceStatus("Voice input not supported in this browser (need Chrome/Edge/Brave)."); return; }
  window.__micError = false;
  if (!rec) {
    rec = new SpeechRec();
    rec.lang = "en-US";
    rec.interimResults = false;
    rec.maxAlternatives = 1;
    rec.onresult = e => { $("question").value = e.results[0][0].transcript; setVoiceStatus(""); };
    rec.onerror = e => { window.__micError = true; setVoiceStatus("Mic error: " + e.error); };
    rec.onend = () => { $("micBtn").textContent = "🎤"; if (!window.__micError) setVoiceStatus(""); };
  }
  if (rec.running) { rec.stop(); $("micBtn").textContent = "🎤"; return; }
  try {
    // getUserMedia not strictly required by SpeechRecognition in Chromium,
    // but requesting it surfaces the mic permission prompt clearly.
    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
      const stream = await navigator.mediaDevices.getUserMedia({audio: true});
      stream.getTracks().forEach(t => t.stop());
    }
  } catch (e) { setVoiceStatus("Microphone permission denied: " + e.name); return; }
  rec.start();
  $("micBtn").textContent = "🔴";
  setVoiceStatus("Listening… speak your question");
}
async function speakAnswer() {
  const text = $("answer").innerText || $("answer").textContent || "";
  if (!("speechSynthesis" in window)) { setVoiceStatus("TTS not supported in this browser."); return; }
  // toggle: if already speaking, stop
  if (window.speechSynthesis.speaking) {
    window.speechSynthesis.cancel();
    $("speakBtn").textContent = "🔊";
    setVoiceStatus("Stopped.");
    return;
  }
  if (!text) { setVoiceStatus("Nothing to read yet — ask a question first."); return; }
  const u = new SpeechSynthesisUtterance(text.replace(/Sources:[\s\S]*$/, ""));
  u.rate = 1.05;
  setVoiceStatus("Speaking… (click 🔊 to stop)");
  u.onstart = () => { $("speakBtn").textContent = "⏹"; };
  u.onend = u.onerror = () => { $("speakBtn").textContent = "🔊"; setVoiceStatus(""); };
  window.speechSynthesis.speak(u);
}
$("askBtn").addEventListener("click", ask);
$("analyzeBtn").addEventListener("click", analyzeRun);
$("micBtn").addEventListener("click", startMic);
$("speakBtn").addEventListener("click", speakAnswer);
$("question").addEventListener("keydown", e => { if ((e.metaKey || e.ctrlKey) && e.key === "Enter") ask(); });
</script>
</body>
</html>
